spring.application.name=tms

# ===============================
# SERVER CONFIG
# ===============================
server.port=8080
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=8192
server.tomcat.accept-count=100

# ===============================
# DATABASE CONFIG (H2 In-Memory for Dev)
# Easily switch to MySQL/PostgreSQL by changing URL, driver, username/password
# ===============================
spring.datasource.url=jdbc:h2:mem:tmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===============================
# CONNECTION POOLING (HikariCP)
# ===============================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# ===============================
# REDIS CACHING
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false

# ===============================
# CACHE CONFIGURATION
# ===============================
spring.cache.cache-names=accounts,transactions,rates
spring.cache.redis.key-prefix=tms:

# ===============================
# ASYNC CONFIGURATION
# ===============================
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-exec-

# ===============================
# ACTUATOR & MONITORING
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# ===============================
# RESILIENCE4J CONFIGURATION
# ===============================
resilience4j.circuitbreaker.instances.transactionService.sliding-window-size=10
resilience4j.circuitbreaker.instances.transactionService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.transactionService.wait-duration-in-open-state=5s
resilience4j.ratelimiter.instances.transactionService.limit-for-period=100
resilience4j.ratelimiter.instances.transactionService.limit-refresh-period=1s

# ===============================
# H2 CONSOLE (for debugging)
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# TRANSACTION LIMITS (Custom properties)
# These can be injected via @Value in validation services
# ===============================
tms.transaction.limit.max=100000
tms.transaction.limit.min=1

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.com.aspora.tms=INFO
logging.level.org.springframework.cache=DEBUG
logging.level.org.springframework.data.redis=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
